<body>
  <a class="skip-link" href="#projects">Skip to projects</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Horizonan home">horizonan</a>
      <nav aria-label="Main"><a href="https://github.com/Horizonan" target="_blank" rel="noopener noreferrer">GitHub</a></nav>
    </header>
    <main>
      <section class="projects" id="projects" aria-labelledby="projects-title">
        <h1 id="projects-title">Projects</h1>
        <article class="project-card" aria-labelledby="rolla-title">
          <div class="project-info">
            <h2 id="rolla-title">Rolla</h2>
            <p class="project-description">3D dice roller.</p>
            <div class="project-actions"><a class="project-link" href="https://horizonan.github.io/rolla/">Open Rolla</a><a class="source-link" href="https://github.com/Horizonan/rolla" target="_blank" rel="noopener noreferrer" aria-label="Rolla on GitHub">GitHub</a></div>
          </div>
          <div class="project-preview" id="rolla-preview">
            <span id="preview-result" role="status" aria-live="polite"></span>
            <canvas id="preview-die" role="img" aria-label="A red three-dimensional die showing five"></canvas>
            <div class="preview-controls" id="preview-controls" hidden>
              <div class="swatches" role="group" aria-label="Preview dice skin">
                <button class="swatch ruby" type="button" aria-label="Ruby skin" aria-pressed="true" data-skin="ruby"><span></span></button>
                <button class="swatch unicorn" type="button" aria-label="Unicorn skin" aria-pressed="false" data-skin="unicorn"><span></span></button>
                <button class="swatch blockcraft" type="button" aria-label="Blockcraft skin" aria-pressed="false" data-skin="blockcraft"><span></span></button>
              </div>
              <button class="preview-roll" id="preview-roll" type="button"><span>Roll</span></button>
            </div>
          </div>
        </article>
      </section>
    </main>
    <footer class="site-footer"><span>© 2026 Horizonan</span><nav aria-label="Legal"><a href="./privacy.html">Privacy</a><a href="./imprint.html">Imprint</a></nav></footer>
